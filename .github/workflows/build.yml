name: Build GKI 6.6 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc

      - name: Download & Setup Android GKI 6.6 Source
        run: |
          mkdir gki && cd gki
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 android-gki
          cd android-gki
          
          # Integrate KernelSU-Next (Built-in)
          curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Build GKI Kernel
        run: |
          cd gki/android-gki
          make ARCH=arm64 LLVM=1 defconfig
          echo "CONFIG_KSU=y" >> .config
          make -j$(nproc) ARCH=arm64 LLVM=1 Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-KSU-Next-BuiltIn
          path: gki/android-gki/arch/arm64/boot/Image.gz
