name: Build GKI 6.6 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc python3 python-is-python3 libncurses-dev curl tar clang lld llvm

      - name: Clone GKI 6.6 & Setup KSU-Next
        run: |
          # Clone AOSP Common Kernel GKI 6.6
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 android-kernel
          cd android-kernel

          # Integrasi KernelSU-Next resmi
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Compile GKI Image
        run: |
          cd android-kernel
          
          # Konfigurasi GKI Defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # Aktifkan KSU Built-in
          scripts/config --enable CONFIG_KSU
          
          # Build Image Kernel
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-KSU-Next-BuiltIn
          path: android-kernel/arch/arm64/boot/Image
