name: Build GKI 6.6 KernelSU-Next (Official AOSP Builder)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      - name: Build GKI Kernel via Auto-GKI Engine
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-version: android15-6.6
          ksu: true
          ksu-version: main
          vendor: true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-KernelSU-Next
          path: |
            android-kernel/arch/arm64/boot/Image
            boot.img
