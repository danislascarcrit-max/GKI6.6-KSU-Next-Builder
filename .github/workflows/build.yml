name: Build GKI 6.6 KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache bison flex libssl-dev libelf-dev bc python3 python-is-python3 libncurses-dev curl tar clang lld

      - name: Clone GKI 6.6 Kernel
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 android-kernel

      - name: Setup KernelSU-Next
        run: |
          cd android-kernel
          # Clone KernelSU-Next langsung ke drivers
          git clone https://github.com/rifs28/KernelSU-Next.git drivers/kernelsu
          
          # Tambahkan entry drivers/kernelsu ke Makefile & Kconfig
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Compile Kernel Image
        run: |
          cd android-kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          echo "CONFIG_KSU=y" >> .config
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz

      - name: Upload Kernel Result
        uses: actions/upload-artifact@v4
        with:
          name: GKI-6.6-KSU-Next-Image
          path: android-kernel/arch/arm64/boot/Image.gz
